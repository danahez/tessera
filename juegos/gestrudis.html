<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<title>Gestrudis · Mímica con amigos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14112b;
  --panel:#221c4a;
  --line:rgba(255,255,255,.09);
  --text:#fff7ec;
  --muted:#aaa3cf;
  --accent:#ff5d73;
  --ok:#3ddc97;
  --warn:#ffc145;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100dvh;
  color:var(--text);
  font-family:var(--body);
  background:
    radial-gradient(900px 520px at 0% -10%, #3b2577 0%, transparent 60%),
    radial-gradient(800px 480px at 110% 110%, #5b1d4c 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  overscroll-behavior:none;
}

/* ---------- Pantallas ---------- */
.screen{
  display:none;
  flex-direction:column;
  min-height:100dvh;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
.screen.active{display:flex}

/* ---------- Botones ---------- */
.btn{
  all:unset;
  box-sizing:border-box;
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:58px;
  padding:14px 18px;
  border-radius:16px;
  cursor:pointer;
  text-align:center;
  font-family:var(--display);
  font-weight:600;
  font-size:20px;
  color:var(--text);
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  transition:transform .1s ease, filter .15s ease, background .15s ease;
  user-select:none;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
.btn.primary{background:var(--ok);color:#0b2a1d;border-color:transparent;box-shadow:0 10px 26px rgba(61,220,151,.28)}
.btn.next{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(255,93,115,.3)}
.btn.grow{flex:2}
.btn.small{flex:none;min-height:42px;padding:8px 14px;font-size:16px;border-radius:12px}

/* ---------- Selección ---------- */
#screen-select{position:relative}
.home-link{position:absolute;left:16px;top:max(16px, env(safe-area-inset-top))}
.brand{text-align:center;padding:6px 0 18px}
.round-pill{
  display:inline-block;
  font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);
  padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  margin-bottom:10px;
}
.logo{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(40px, 9vw, 64px);
  line-height:1;
  letter-spacing:-.01em;
  background:linear-gradient(95deg, #ff5d73 0%, #ff8a3d 45%, #ffc145 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tag{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.4}
.tag b{color:var(--text)}

.grid{display:grid;grid-template-columns:1fr;gap:14px}

.pick{
  all:unset;
  box-sizing:border-box;
  display:block;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  padding:16px 16px 18px;
  border-radius:20px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)), var(--panel);
  border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.28);
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  animation:rise .4s ease both;
}
.pick::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.pick:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 16px 36px rgba(0,0,0,.35)}
.pick:active{transform:scale(.98)}
.pick:focus-visible{outline:3px solid var(--c);outline-offset:3px}

.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.emoji{
  flex:none;
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;
  font-size:26px;line-height:1;
  background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 2px var(--c);
}
.pick .title{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;color:var(--c)}

.pick-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.pick-list li{display:flex;align-items:flex-start;gap:8px;font-size:15px;line-height:1.25;color:#ece8ff}
.num{
  flex:none;
  display:grid;place-items:center;
  border-radius:50%;
  font-family:var(--display);font-weight:700;
  background:var(--c);color:#1a1433;
}
.pick-list .num{width:22px;height:22px;font-size:13px;margin-top:-1px}

.select-foot{
  position:sticky;bottom:0;
  margin-top:auto;
  padding:18px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:linear-gradient(180deg, transparent, var(--bg) 40%);
}
.select-foot .btn{width:100%;max-width:420px;flex:none}
.deck-info{color:var(--muted);font-size:13px}

/* ---------- Juego ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.topbar .round{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px;letter-spacing:.04em}

.play{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}

.big-card{
  position:relative;overflow:hidden;
  padding:20px 18px 18px;
  border-radius:24px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)), var(--panel);
  border:1px solid var(--line);
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  animation:rise .35s ease both;
}
.big-card::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.big-card .head{margin-bottom:14px}
.big-card .emoji{width:54px;height:54px;font-size:32px;border-radius:16px}
.big-card h2{font-family:var(--display);font-weight:600;font-size:clamp(24px, 6vw, 40px);line-height:1.08;color:var(--c)}

.big-list{list-style:none;display:grid;grid-template-columns:1fr;gap:8px}
.big-list li{
  display:flex;align-items:center;gap:12px;
  padding:7px 10px;
  border-radius:14px;
  background:rgba(255,255,255,.045);
  font-weight:800;
  font-size:clamp(18px, 5vw, 26px);
  line-height:1.15;
}
.big-list .num{width:1.6em;height:1.6em;font-size:.82em}

.timer-wrap{flex:1;display:grid;place-items:center;min-height:0;padding:4px 0}
.ring{
  position:relative;
  width:min(58vw, 30dvh, 300px);
  aspect-ratio:1;
  container-type:inline-size;
  cursor:pointer;
  user-select:none;
}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.ring .prog{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transition:stroke .3s ease}
.ring.warn .prog{stroke:var(--warn)}
.ring.danger .prog,.ring.done .prog{stroke:var(--accent)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#timer{font-family:var(--display);font-weight:700;font-size:40cqw;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s ease}
#timer-sub{margin-top:2px;font-size:7.5cqw;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase;min-height:1.2em}
.ring.warn #timer{color:var(--warn)}
.ring.danger #timer{color:var(--accent);animation:pulse 1s ease-in-out infinite}
.ring.done #timer{color:var(--accent);font-size:17cqw;animation:pop .45s ease both}

.controls{display:flex;gap:10px;margin-top:14px}

.flash{animation:flash .9s ease}

/* ---------- Animaciones ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes flash{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,93,115,0)}25%{box-shadow:inset 0 0 0 14px rgba(255,93,115,.75)}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------- Responsive ---------- */
@media (min-width:700px){
  .screen{padding-left:28px;padding-right:28px}
  .grid{grid-template-columns:1fr 1fr;gap:18px}
  .pick{padding:18px 20px 20px}
  .pick-list li{font-size:16px}
  .big-list{grid-template-columns:1fr 1fr;gap:10px 12px}
  .big-list li{font-size:clamp(20px, 3.4vw, 30px)}
  .controls{max-width:640px;width:100%;margin-left:auto;margin-right:auto}
}

/* Horizontal (tablet/portátil, o móvil tumbado): carta a la izquierda, temporizador a la derecha */
@media (orientation:landscape) and (min-width:640px){
  .play{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:center;gap:24px}
  .big-list{grid-template-columns:1fr;gap:min(10px, 1.4dvh)}
  .big-list li{font-size:clamp(16px, min(2.5vw, 4.6dvh), 34px);padding:min(8px, 1.2dvh) 12px}
  .big-card h2{font-size:clamp(20px, min(3.2vw, 6dvh), 42px)}
  .big-card .head{margin-bottom:min(14px, 2dvh)}
  .ring{width:min(30vw, 52dvh, 380px)}
}
/* Móviles bajitos en vertical (iPhone SE y similares) */
@media (orientation:portrait) and (max-height:740px){
  .topbar{margin-bottom:10px}
  .btn.small{min-height:38px}
  .big-card{padding:16px 14px 14px}
  .big-card .head{margin-bottom:10px}
  .big-card .emoji{width:44px;height:44px;font-size:26px}
  .big-card h2{font-size:24px}
  .big-list{gap:6px}
  .big-list li{padding:5px 10px;font-size:18px}
  .play{gap:10px}
  .ring{width:min(54vw, 27dvh)}
  .controls{margin-top:10px}
  .btn{min-height:54px}
}
@media (orientation:landscape) and (max-height:500px){
  .screen{padding-top:10px;padding-bottom:10px}
  .topbar{margin-bottom:8px}
  .big-card{padding:12px 14px}
  .big-card .emoji{width:40px;height:40px;font-size:24px}
  .controls{margin-top:8px}
  .btn{min-height:48px;font-size:18px}
}
</style>
</head>

  <div class="grid" id="grid"></div>

  <footer class="select-foot">
    <button class="btn" id="btn-shuffle" type="button">🔀 Ver otras 4 cartas</button>
    <p class="deck-info" id="deck-info"></p>
  </footer>
</section>

<!-- PANTALLA 2: JUGAR -->
<section id="screen-play" class="screen" aria-label="Ronda en juego">

  <main class="play">
    <article class="big-card" id="big-card">

        <span class="emoji" id="big-emoji"></span>
        <h2 id="big-title"></h2>
      </div>
      <ol class="big-list" id="big-list"></ol>
    </article>

    <div class="timer-wrap">
      <div class="ring" id="ring" role="timer" aria-live="off" title="Toca para empezar o pausar">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="54"/>
          <circle class="prog" id="prog" cx="60" cy="60" r="54"/>
        </svg>
        <div class="ring-label">
          <span id="timer">30</span>
          <span id="timer-sub">segundos</span>
        </div>
      </div>
    </div>
  </main>

  <div class="controls" id="controls"></div>
</section>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const DURATION = 30; // segundos por ronda
const PALETTE = ['#ff5d73','#ffc145','#3ddc97','#4cc9f0','#b388ff','#ff8a3d','#f472b6','#a3e635'];

const DECK = RAW.map(([emoji, title, words], i) => ({
  id: i, emoji, title, words, color: PALETTE[i % PALETTE.length]
}));

const $ = (s) => document.querySelector(s);
const screens = { select: $('#screen-select'), play: $('#screen-play') };

let round = 1;
/* Cartas ya jugadas hoy. Solo cuenta como jugada la carta elegida cuando se
   pone en marcha el tiempo; las que salen y no se eligen pueden volver a salir.
   Se recuerda aunque se cierre la app y se vacía cada día a las 5:00. */
const USED_KEY = 'deck:gestrudis';
let usedDay = G.gameDay();
let used = loadUsed();

function loadUsed() {
  const s = G.store.get(USED_KEY, null);
  const ok = s && s.day === usedDay && Array.isArray(s.used);
  return new Set(ok ? s.used.filter((id) => id < DECK.length) : []);
}
function saveUsed() { G.store.set(USED_KEY, { day: usedDay, used: [...used] }); }
function checkDay() {
  if (usedDay !== G.gameDay()) { usedDay = G.gameDay(); used.clear(); saveUsed(); }
}
function markUsed(card) {
  if (!card || used.has(card.id)) return;
  checkDay();
  used.add(card.id);
  saveUsed();
}

let currentFour = [];     // las 4 cartas en la mesa
let current = null;       // carta elegida

/* =========================================================
   UTILIDADES
   ========================================================= */
function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(name) {
  Object.entries(screens).forEach(([k, el]) => el.classList.toggle('active', k === name));
  window.scrollTo(0, 0);
}

function fillList(ol, words) {
  ol.innerHTML = '';
  words.forEach((w, i) => {
    const li = document.createElement('li');
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = i + 1;
    const t = document.createElement('span');
    t.textContent = w;
    li.append(n, t);
    ol.appendChild(li);
  });
}

/* =========================================================
   SELECCIÓN DE CARTAS
   ========================================================= */
function drawFour() {
  checkDay();
  const onTable = new Set(currentFour.map(c => c.id));
  let pool = DECK.filter(c => !used.has(c.id) && !onTable.has(c.id));
  if (pool.length < 4) {            // mazo agotado: se vuelve a barajar
    used.clear();
    saveUsed();
    pool = DECK.filter(c => !onTable.has(c.id));
  }
  currentFour = shuffle(pool).slice(0, 4);
}

function renderSelection() {
  const grid = $('#grid');
  grid.innerHTML = '';
  currentFour.forEach((card, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.style.setProperty('--c', card.color);
    b.style.animationDelay = (i * 60) + 'ms';

    const head = document.createElement('div');
    head.className = 'head';
    const em = document.createElement('span');
    em.className = 'emoji';
    em.textContent = card.emoji;
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = card.title;
    head.append(em, title);

    const ol = document.createElement('ol');
    ol.className = 'pick-list';
    fillList(ol, card.words);

    b.append(head, ol);
    b.addEventListener('click', () => selectCard(card));
    grid.appendChild(b);
  });

  $('#round-pill').textContent = `Ronda ${round}`;
  const left = DECK.length - used.size;
  $('#deck-info').textContent = `${DECK.length} cartas en el mazo · ${left} sin jugar hoy`;
}

function goToSelection(newCards) {
  resetTimer(false);
  releaseWakeLock();
  if (newCards || currentFour.length === 0) drawFour();
  renderSelection();
  show('select');
}

function selectCard(card) {
  unlockAudio();
  current = card;
  const big = $('#big-card');
  big.style.setProperty('--c', card.color);
  big.style.animation = 'none'; big.offsetHeight; big.style.animation = '';
  $('#big-emoji').textContent = card.emoji;
  $('#big-title').textContent = card.title;
  fillList($('#big-list'), card.words);
  $('#round-label').textContent = `Ronda ${round}`;
  resetTimer();
  show('play');
  requestWakeLock();
}

function nextRound() {
  markUsed(current);
  current = null;
  round++;
  goToSelection(true);
}

/* =========================================================
   TEMPORIZADOR
   ========================================================= */
const CIRC = 2 * Math.PI * 54;
const prog = $('#prog');
prog.style.strokeDasharray = CIRC;

let tState = 'idle';               // idle | running | paused | done
let remainingMs = DURATION * 1000;
let endAt = 0;
let rafId = null;
let lastSec = DURATION;

function drawTimer() {
  const sec = Math.ceil(remainingMs / 1000);
  const ring = $('#ring');
  prog.style.strokeDashoffset = tState === 'done' ? 0 : CIRC * (1 - remainingMs / (DURATION * 1000));
  const active = tState === 'running' || tState === 'paused';
  ring.classList.toggle('warn', active && sec <= 10 && sec > 5);
  ring.classList.toggle('danger', active && sec <= 5);
  ring.classList.toggle('done', tState === 'done');
  $('#timer').textContent = tState === 'done' ? '¡Tiempo!' : sec;
  $('#timer-sub').textContent =
    tState === 'paused' ? 'en pausa' :
    tState === 'idle'   ? 'segundos' :
    tState === 'done'   ? '' : 'segundos';
}

function tick() {
  remainingMs = Math.max(0, endAt - performance.now());
  const sec = Math.ceil(remainingMs / 1000);
  if (sec !== lastSec) {
    if (sec <= 5 && sec > 0) tone(880, 0.12, 'sine', 0.25);
    lastSec = sec;
  }
  if (remainingMs <= 0) { finishTimer(); return; }
  drawTimer();
  rafId = requestAnimationFrame(tick);
}

function startTimer() {
  if (tState === 'running' || tState === 'done') return;
  unlockAudio();
  if (tState === 'idle') tone(660, 0.12, 'sine', 0.2);
  markUsed(current);
  tState = 'running';
  endAt = performance.now() + remainingMs;
  lastSec = Math.ceil(remainingMs / 1000);
  requestWakeLock();
  renderControls();
  rafId = requestAnimationFrame(tick);
}

function pauseTimer() {
  if (tState !== 'running') return;
  cancelAnimationFrame(rafId);
  remainingMs = Math.max(0, endAt - performance.now());
  tState = 'paused';
  drawTimer();
  renderControls();
}

function resetTimer(render = true) {
  cancelAnimationFrame(rafId);
  tState = 'idle';
  remainingMs = DURATION * 1000;
  lastSec = DURATION;
  drawTimer();
  if (render) renderControls();
}

function finishTimer() {
  cancelAnimationFrame(rafId);
  remainingMs = 0;
  tState = 'done';
  drawTimer();
  renderControls();
  // Alarma final
  tone(523, 0.18, 'square', 0.12, 0);
  tone(523, 0.18, 'square', 0.12, 0.22);
  tone(392, 0.55, 'square', 0.12, 0.44);
  try { navigator.vibrate && navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) {}
  const sc = screens.play;
  sc.classList.remove('flash'); void sc.offsetWidth; sc.classList.add('flash');
}

function renderControls() {
  const c = $('#controls');
  c.innerHTML = '';
  const add = (label, cls, fn) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.addEventListener('click', fn);
    c.appendChild(b);
  };
  if (tState === 'idle') {
    add('▶  Empezar', 'primary', startTimer);
  } else if (tState === 'running') {
    add('⏸  Pausa', 'grow', pauseTimer);
    add('↺', '', () => resetTimer());
  } else if (tState === 'paused') {
    add('▶  Seguir', 'primary grow', startTimer);
    add('↺', '', () => resetTimer());
  } else {
    add('↺  Repetir', '', () => resetTimer());
    add('Siguiente ronda  →', 'next grow', nextRound);
  }
  $('#btn-back').style.visibility = tState === 'running' ? 'hidden' : 'visible';
}

// Tocar el círculo también empieza / pausa
$('#ring').addEventListener('click', () => {
  if (tState === 'idle' || tState === 'paused') startTimer();
  else if (tState === 'running') pauseTimer();
});

// Teclado: espacio = empezar/pausa, Enter = siguiente ronda al acabar
document.addEventListener('keydown', (e) => {
  if (!screens.play.classList.contains('active')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (tState === 'running') pauseTimer(); else if (tState !== 'done') startTimer();
  } else if (e.code === 'Enter' && tState === 'done') {
    e.preventDefault(); nextRound();
  }
});

/* =========================================================
   SONIDO (sin archivos, generado con Web Audio)
   ========================================================= */
let actx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('gestrudis-sound') !== 'off'; } catch (e) {}

function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}

function tone(freq, dur, type = 'sine', vol = 0.2, when = 0) {
  if (!soundOn || !actx) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.03);
}

function renderSoundBtn() {
  $('#btn-sound').textContent = soundOn ? '🔊' : '🔇';
}
$('#btn-sound').addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('gestrudis-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  renderSoundBtn();
  if (soundOn) { unlockAudio(); tone(660, 0.1); }
});

/* =========================================================
   PANTALLA ENCENDIDA durante la partida
   ========================================================= */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
function releaseWakeLock() {
  try { wakeLock && wakeLock.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && screens.play.classList.contains('active')) requestWakeLock();
});

/* =========================================================
   BOTONES Y ARRANQUE
   ========================================================= */
$('#btn-shuffle').addEventListener('click', () => goToSelection(true));
$('#btn-back').addEventListener('click', () => goToSelection(false));

renderSoundBtn();
goToSelection(true);
</script>
</body>
</html>
