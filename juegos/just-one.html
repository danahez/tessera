<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#17181b">
    <title>Just One</title>
    <link rel="stylesheet" href="../shared/estilo.css">
</head>
<body>

    <!-- MENÚ -->
    <div id="screen-menu" class="screen menu active">
        <a class="home-link" href="../index.html" data-i18n="home">← Juegos</a>
        <header class="menu-head">
            <h1>Just One</h1>
            <p data-i18n="subtitle"></p>
        </header>
        <div class="field">
            <span class="field-label" data-i18n="lang">Idioma</span>
            <select id="langSelect" data-seg aria-label="Idioma / Language">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label" data-i18n="cooldown">Espera para poder pasar</span>
            <select id="cooldownSelect" data-seg data-i18n-aria="cooldown">
                <option value="0" data-i18n="no">No</option>
                <option value="3">3 s</option>
                <option value="5" selected>5 s</option>
                <option value="10">10 s</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label" data-i18n="scoring">Puntuación</span>
            <select id="pointsSelect" data-seg data-i18n-aria="scoring">
                <option value="off" selected data-i18n="noPoints">Sin puntos</option>
                <option value="on" data-i18n="countHits">Contar aciertos</option>
            </select>
        </div>
        <button class="btn-main" id="btnStart" data-i18n="start">Empezar</button>
        <p class="hint" id="deckInfo"></p>
    </div>

    <!-- JUEGO -->
    <div id="screen-game" class="screen">
        <div class="bar">
            <button class="small-btn" id="btnMenu" data-i18n="menu">← Menú</button>
            <span class="stat" id="remaining"></span>
            <span class="stat" id="score-wrap"><span id="score-board">0</span> pts</span>
        </div>
        <div class="prog"><i id="deckBar"></i></div>
        <p class="turn-label" data-i18n="showIt">Enséñalo a todos menos a quien adivina</p>

        <div class="card" id="card">
            <div class="card-inner" id="word-view">
                <div class="kicker" data-i18n="secret">Palabra secreta</div>
                <div class="word" id="palabra"></div>
                <div class="note" data-i18n="rule">Una pista por persona. Las repetidas se eliminan.</div>
            </div>
            <div class="card-inner" id="end-view" hidden>
                <div class="word" data-i18n="theEnd">Fin</div>
                <p class="note" data-i18n="endNote">Habéis visto todas las palabras del mazo.</p>
                <button class="btn-main" id="btnReshuffle" data-i18n="reshuffle">Barajar de nuevo</button>
            </div>
        </div>

        <div class="controls" id="controls">
            <button class="btn btn-pass" id="btnFail"><span data-i18n="fail">Pasar / Fallo</span><small data-i18n="next">siguiente</small></button>
            <button class="btn btn-success" id="btnHit"><span data-i18n="correct">Acierto</span><small data-i18n="next">siguiente</small></button>
        </div>
    </div>

    <script src="../shared/common.js"></script>
    <script>
        const listaCompleta = [
            // --- Originales ---
            "Banco", "Carta", "Sirena", "Planta", "Muñeca", "Copa", "Ratón", "Batería", "Mono", "Taco", 
            "Mango", "Cura", "Radio", "Cometa", "Bolsa", "Canguro", "Estrella", "Fuente", "Vela", "Gafas", 
            "Cama", "Llave", "Zapato", "Paraguas", "Espejo", "Tijeras", "Reloj", "Anillo", "Sombrero", "Pantalón", 
            "Camisa", "Calcetín", "Maleta", "Cartera", "Móvil", "Televisión", "Silla", "Mesa", "Puerta", "Ventana", 
            "Plátano", "Pizza", "Huevo", "Chocolate", "Sol", "Nube", "Rosa", "Vaca", "Perro", "Elefante", 
            "León", "Tigre", "Tiburón", "Pez", "Pájaro", "Árbol", "Flor", "Montaña", "Mar", "Río", 
            "Fuego", "Nieve", "Lluvia", "Pirata", "Payaso", "Fantasma", "Vampiro", "Médico", "Bombero", "Policía", 
            "Profesor", "Bruja", "Zombi", "Rey", "Reina", "Bebé", "Abuelo", "Martillo", "Cuchillo", "Tenedor", 
            "Plato", "Vaso", "Botella", "Lápiz", "Papel", "Libro", "Globo", "Pelota", "Guitarra", "Piano", 
            "Coche", "Bicicleta", "Avión", "Barco", "Tren", "Amor", "Boda", "Fiesta", "Navidad", "Verano",
            
            // --- Nuevas (Lugares, Famosos, Cine, Comida, Variedad) ---
            "París", "Egipto", "Londres", "China", "Hospital", "Cárcel", "Biblioteca", "Cine", "Playa", "Desierto",
            "Selva", "Granja", "Castillo", "Escuela", "Circo", "Museo", "Hotel", "Aeropuerto", "Cocina", "Baño",
            "Estadio", "Supermercado", "Iglesia", "Cementerio", "Zoológico", "Piscina", "Batman", "Superman", "Spiderman", "Pikachu",
            "Mario", "Barbie", "Tarzán", "Sherlock", "Drácula", "Frankenstein", "Messi", "Shakira", "Einstein", "Picasso",
            "Papa", "Ninja", "Samurái", "Vikingo", "Mimo", "Alien", "Robot", "Ciborg", "Hulk", "Thor",
            "Yoda", "Minion", "Titanic", "Matrix", "Shrek", "Avatar", "Simpson", "Friends", "Disney", "Netflix",
            "Youtube", "Instagram", "Google", "Wifi", "Internet", "Tetris", "Poker", "Ajedrez", "Fútbol", "Tenis",
            "Baloncesto", "Golf", "Óscar", "Hollywood", "Emoji", "Sushi", "Hamburguesa", "Paella", "Espagueti", "Ensalada",
            "Sopa", "Helado", "Pastel", "Galleta", "Caramelo", "Palomitas", "Cerveza", "Vino", "Leche", "Café",
            "Té", "Zumo", "Miel", "Sal", "Azúcar", "Kétchup", "Dinosaurio", "Dragón", "Unicornio", "Pingüino",
            "Jirafa", "Oso", "Lobo", "Águila", "Serpiente", "Rana", "Mosquito", "Abeja", "Araña", "Volcán",
            "Tornado", "Arcoíris", "Luna", "Universo", "Planeta", "Isla", "Dinero", "Lotería", "Trabajo", "Vacaciones",
            "Regalo", "Beso", "Abrazo", "Música", "Baile", "Foto", "Cámara", "Micrófono", "Auriculares", "Ordenador",
            "Teclado", "Pantalla", "Toalla", "Jabón", "Champú", "Perfume", "Maquillaje", "Cepillo", "Diente", "Lengua",
            "Ojo", "Mano", "Pie", "Corazón", "Cerebro", "Esqueleto", "Momia", "Estatua", "Cuadro", "Basura",
            "Mapa", "Bandera", "Semáforo", "Puente", "Ascensor"
        ];


        // --- TEXTOS DE LA PANTALLA ---
        G.T.es = {
            subtitle: 'Una palabra secreta y una pista por persona. Las pistas repetidas se eliminan.',
            home: '← Juegos', lang: 'Idioma', cooldown: 'Espera para poder pasar', no: 'No',
            scoring: 'Puntuación', noPoints: 'Sin puntos', countHits: 'Contar aciertos', start: 'Empezar',
            menu: '← Menú', showIt: 'Enséñalo a todos menos a quien adivina', secret: 'Palabra secreta',
            rule: 'Una pista por persona. Las repetidas se eliminan.', theEnd: 'Fin',
            endNote: 'Habéis visto todas las palabras del mazo.', reshuffle: 'Barajar de nuevo',
            fail: 'Pasar / Fallo', correct: 'Acierto', next: 'siguiente',
            deckInfo: '{total} palabras · {left} sin salir hoy', left: 'Quedan {n}',
            confirmMenu: 'Lleváis {n} puntos. ¿Volver al menú?',
        };
        G.T.en = {
            subtitle: 'One secret word and one clue per person. Duplicate clues are cancelled.',
            home: '← Games', lang: 'Language', cooldown: 'Wait before passing', no: 'No',
            scoring: 'Scoring', noPoints: 'No points', countHits: 'Count correct guesses', start: 'Start',
            menu: '← Menu', showIt: 'Show it to everyone except the guesser', secret: 'Secret word',
            rule: 'One clue each. Duplicate clues are cancelled.', theEnd: 'The end',
            endNote: 'You have seen every word in the deck.', reshuffle: 'Shuffle again',
            fail: 'Pass / Miss', correct: 'Correct', next: 'next',
            deckInfo: '{total} words · {left} not played today', left: '{n} left',
            confirmMenu: 'You have {n} points. Back to the menu?',
        };

        // --- PALABRAS EN INGLÉS (B1-B2, con bastantes de doble sentido) ---
        const listaIngles = [
            "Bank", "Letter", "Mermaid", "Plant", "Doll", "Cup", "Mouse", "Battery", "Monkey", "Taco",
            "Mango", "Priest", "Radio", "Kite", "Bag", "Kangaroo", "Star", "Fountain", "Candle", "Glasses",
            "Bed", "Key", "Shoe", "Umbrella", "Mirror", "Scissors", "Watch", "Ring", "Hat", "Trousers",
            "Shirt", "Sock", "Suitcase", "Wallet", "Mobile phone", "Television", "Chair", "Table", "Door", "Window",
            "Banana", "Pizza", "Egg", "Chocolate", "Sun", "Cloud", "Rose", "Cow", "Dog", "Elephant",
            "Lion", "Tiger", "Shark", "Fish", "Bird", "Tree", "Flower", "Mountain", "Sea", "River",
            "Fire", "Snow", "Rain", "Pirate", "Clown", "Ghost", "Vampire", "Doctor", "Firefighter", "Police",
            "Teacher", "Witch", "Zombie", "King", "Queen", "Baby", "Grandfather", "Hammer", "Knife", "Fork",
            "Plate", "Glass", "Bottle", "Pencil", "Paper", "Book", "Balloon", "Ball", "Guitar", "Piano",
            "Car", "Bicycle", "Plane", "Boat", "Train", "Love", "Wedding", "Party", "Christmas", "Summer",
            "Paris", "Egypt", "London", "China", "Hospital", "Prison", "Library", "Cinema", "Beach", "Desert",
            "Jungle", "Farm", "Castle", "School", "Circus", "Museum", "Hotel", "Airport", "Kitchen", "Bathroom",
            "Stadium", "Supermarket", "Church", "Cemetery", "Zoo", "Swimming pool", "Batman", "Superman", "Spider-Man", "Pikachu",
            "Mario", "Barbie", "Tarzan", "Sherlock", "Dracula", "Frankenstein", "Messi", "Shakira", "Einstein", "Picasso",
            "Pope", "Ninja", "Samurai", "Viking", "Mime", "Alien", "Robot", "Cyborg", "Hulk", "Thor",
            "Yoda", "Minion", "Titanic", "Matrix", "Shrek", "Avatar", "Simpsons", "Friends", "Disney", "Netflix",
            "YouTube", "Instagram", "Google", "Wi-Fi", "Internet", "Tetris", "Poker", "Chess", "Football", "Tennis",
            "Basketball", "Golf", "Oscar", "Hollywood", "Emoji", "Sushi", "Burger", "Paella", "Spaghetti", "Salad",
            "Soup", "Ice cream", "Cake", "Biscuit", "Sweets", "Popcorn", "Beer", "Wine", "Milk", "Coffee",
            "Tea", "Juice", "Honey", "Salt", "Sugar", "Ketchup", "Dinosaur", "Dragon", "Unicorn", "Penguin",
            "Giraffe", "Bear", "Wolf", "Eagle", "Snake", "Frog", "Mosquito", "Bee", "Spider", "Volcano",
            "Tornado", "Rainbow", "Moon", "Universe", "Planet", "Island", "Money", "Lottery", "Job", "Holidays",
            "Present", "Kiss", "Hug", "Music", "Dance", "Photo", "Camera", "Microphone", "Headphones", "Computer",
            "Keyboard", "Screen", "Towel", "Soap", "Shampoo", "Perfume", "Make-up", "Brush", "Tooth", "Tongue",
            "Eye", "Hand", "Foot", "Heart", "Brain", "Skeleton", "Mummy", "Statue", "Painting", "Rubbish",
            "Map", "Flag", "Traffic light", "Bridge", "Lift",
            "Bat", "Bark", "Spring", "Match", "Pitch", "Seal", "Crane", "Jam", "Date", "Fan",
            "Bow", "Club", "Rock", "Wave", "Trunk", "Palm", "Fall", "Ruler", "Mint", "Bowl",
            "Chest", "Stamp", "Tank", "Organ", "Mole", "Space", "Selfie", "Podcast", "Meme", "Festival",
            "Erasmus", "Vegan", "Hangover", "Minecraft", "Pokémon"
        ];

        const $ = (id) => document.getElementById(id);
        // Un mazo por idioma (deck:just-one y deck:just-one-en)
        const mazos = {};
        const mazoDe = (l) => mazos[l] || (mazos[l] = l === 'en'
            ? new G.Deck('just-one-en', listaIngles)
            : new G.Deck('just-one', listaCompleta));
        let mazo = mazoDe(G.lang);
        const infoMazo = () => { $("deckInfo").innerText = G.t('deckInfo', { total: mazo.total, left: mazo.remaining }); };
        const cooldown = new G.Cooldown([$("btnFail")]);
        let puntuacion = 0;
        let ajustes = G.store.get('settings:just-one', { cooldown: 5, points: 'off' });

        $("cooldownSelect").value = ajustes.cooldown;
        $("pointsSelect").value = ajustes.points;
        G.initLang((l) => { mazo = mazoDe(l); infoMazo(); });
        infoMazo();
        G.segmented();

        function mostrar(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            $(id).classList.add('active');
        }

        function empezar() {
            ajustes = {
                cooldown: parseInt($("cooldownSelect").value, 10),
                points: $("pointsSelect").value
            };
            G.store.set('settings:just-one', ajustes);
            puntuacion = 0;
            $("score-board").innerText = "0";
            $("score-wrap").style.visibility = ajustes.points === 'on' ? 'visible' : 'hidden';
            mostrar('screen-game');
            G.keepAwake(true);
            siguientePalabra();
        }

        function volverAlMenu() {
            if (ajustes.points === 'on' && puntuacion > 0 &&
                !confirm(G.t('confirmMenu', { n: puntuacion }))) return;
            cooldown.stop();
            G.keepAwake(false);
            infoMazo();
            mostrar('screen-menu');
        }

        let cambiando = false; // evita dobles toques durante la animación

        function gestionarTurno(acierto) {
            if (cambiando) return;
            cambiando = true;
            // Actualizar puntuación si acertó
            if (acierto) {
                puntuacion++;
                $("score-board").innerText = puntuacion;
            }

            // Animación suave de cambio
            const card = $("card");
            card.style.opacity = "0.3";
            card.style.transform = "scale(0.98)";

            setTimeout(() => {
                siguientePalabra();
                card.style.opacity = "";
                card.style.transform = "";
                cambiando = false;
            }, 150);
        }

        function siguientePalabra() {
            const fin = mazo.remaining === 0;
            $("word-view").hidden = fin;
            $("end-view").hidden = !fin;
            $("controls").style.visibility = fin ? 'hidden' : 'visible';
            if (fin) {
                cooldown.stop();
                $("remaining").innerText = G.t('left', { n: 0 });
                $("deckBar").style.setProperty('--p', 0);
                return;
            }

            $("palabra").innerText = mazo.draw();
            $("remaining").innerText = G.t('left', { n: mazo.remaining });
            $("deckBar").style.setProperty('--p', mazo.remaining / mazo.total);
            cooldown.start(ajustes.cooldown);
        }

        $("btnStart").addEventListener('click', empezar);
        $("btnMenu").addEventListener('click', volverAlMenu);
        $("btnFail").addEventListener('click', () => gestionarTurno(false));
        $("btnHit").addEventListener('click', () => gestionarTurno(true));
        $("btnReshuffle").addEventListener('click', () => { mazo.reset(); siguientePalabra(); });
    </script>
</body>
</html>
