<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#17181b">
    <title>Tabú</title>
    <link rel="stylesheet" href="../shared/estilo.css">
</head>
<body>

    <!-- PANTALLA 1: MENÚ -->
    <div id="screen-menu" class="screen menu active">
        <a class="home-link" href="../index.html" data-i18n="home">← Juegos</a>
        <header class="menu-head">
            <h1 data-i18n="title"></h1>
            <p data-i18n="subtitle"></p>
        </header>
        <div class="field">
            <span class="field-label" data-i18n="lang">Idioma</span>
            <select id="langSelect" data-seg aria-label="Idioma / Language">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label" data-i18n="time">Tiempo de ronda</span>
            <select id="timeSelect" data-seg data-i18n-aria="time">
                <option value="30">30 s</option>
                <option value="60" selected>60 s</option>
                <option value="90">90 s</option>
                <option value="120">2 min</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label" data-i18n="cooldown">Espera para poder pasar</span>
            <select id="cooldownSelect" data-seg data-i18n-aria="cooldown">
                <option value="0" data-i18n="no">No</option>
                <option value="3">3 s</option>
                <option value="5" selected>5 s</option>
                <option value="10">10 s</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label" data-i18n="mode">Modo de juego</span>
            <select id="modeSelect" data-seg="col" data-i18n-aria="mode">
                <option value="solo" data-i18n="modeSolo">Un grupo</option>
                <option value="round" data-i18n="modeRound">Dos equipos · puntos por turno</option>
                <option value="total" data-i18n="modeTotal">Dos equipos · marcador total</option>
            </select>
        </div>
        <div id="teamsBox" class="teams" hidden>
            <input id="teamA" maxlength="16" data-i18n-ph="team1" data-i18n-aria="team1">
            <input id="teamB" maxlength="16" data-i18n-ph="team2" data-i18n-aria="team2">
        </div>
        <div id="roundsBox" class="field" hidden>
            <span class="field-label" data-i18n="rounds">Rondas (cada equipo juega un turno por ronda)</span>
            <select id="roundsSelect" data-seg data-i18n-aria="rounds">
                <option value="0" data-i18n="noLimit">Sin límite</option>
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="10">10</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label" data-i18n="sounds">Sonidos</span>
            <select id="soundSelect" data-seg data-i18n-aria="sounds">
                <option value="on" data-i18n="on">Activados</option>
                <option value="off" data-i18n="off">Desactivados</option>
            </select>
        </div>
        <button class="btn-main" id="btnStart" data-i18n="start">Empezar</button>
        <p class="hint" data-i18n="hint"></p>
    </div>

    <!-- PANTALLA 2: PREPARADOS -->
    <div id="screen-ready" class="screen center">
        <div class="panel">
            <p class="ready-title" id="readyTitle"></p>
            <p class="ready-sub" id="readySub"></p>
            <div class="board" id="readyBoard"></div>
            <button class="btn-main" id="btnGo" data-i18n="startTurn">Empezar turno</button>
            <button class="btn-link" data-to-menu="confirm" data-i18n="backMenu">Volver al menú</button>
        </div>
    </div>

    <!-- PANTALLA 3: JUEGO -->
    <div id="screen-game" class="screen">
        <div class="bar">
            <button class="icon-btn" id="btnStop" data-i18n-aria="stopTurn">✕</button>
            <span class="clock" id="timerDisplay">60 s</span>
            <span class="stat"><span id="scoreDisplay">0</span> pts</span>
        </div>
        <div class="prog"><i id="timerBar"></i></div>
        <p class="turn-label" id="turnLabel"></p>

        <div class="card">
            <div class="kicker" data-i18n="describe">Describe</div>
            <div class="word" id="wordTarget"></div>
            <div class="kicker forbidden-title" data-i18n="dontSay">No digas</div>
            <div class="forbidden-list" id="wordForbidden"></div>
        </div>

        <div class="controls">
            <button class="btn btn-fail" data-points="-1" data-flash="#3a2427"><span data-i18n="taboo">Tabú</span><small>−1</small></button>
            <button class="btn btn-pass" data-points="0" data-flash="#2a2b30" data-cooldown><span data-i18n="pass">Pasar</span><small>0</small></button>
            <button class="btn btn-success" data-points="1" data-flash="#1f3328"><span data-i18n="correct">Acierto</span><small>+1</small></button>
        </div>
    </div>

    <!-- PANTALLA 4: RESULTADO DEL TURNO -->
    <div id="screen-result" class="screen center">
        <div class="panel">
            <p class="score-label" data-i18n="endOfTurn">Fin del turno</p>
            <p class="score-label" id="resultTitle"></p>
            <p class="score-big" id="finalScore">0</p>
            <p class="score-label" data-i18n="unit"></p>
            <div class="board" id="resultBoard"></div>
            <button class="btn-main" id="btnNext">Siguiente turno</button>
            <button class="btn-link" id="btnEnd" data-i18n="endGame">Terminar partida</button>
            <button class="btn-link" data-to-menu="confirm" data-i18n="backMenu">Volver al menú</button>
        </div>
    </div>

    <!-- PANTALLA 5: RESULTADO FINAL -->
    <div id="screen-final" class="screen center">
        <div class="panel">
            <p class="score-label" data-i18n="finalResult">Resultado final</p>
            <p class="ready-title" id="finalTitle"></p>
            <div class="board" id="finalBoard"></div>
            <button class="btn-main" data-to-menu data-i18n="newGame">Nueva partida</button>
        </div>
    </div>

    <script src="../shared/turns.js"></script>
